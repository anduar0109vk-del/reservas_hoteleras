apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 39000
      targetPort: 39000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: reservas-hoteleras-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 39000
          env:
            - name: PORT
              value: "39000"
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/reservas_hoteleras?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: DB_USERNAME
              value: reservas
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservas-secrets
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: reservas-secrets
                  key: jwt-secret
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: reservas-config
                  key: frontend-url
            - name: PAYMENTS_DEMO_MODE
              value: "true"
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
          readinessProbe:
            tcpSocket:
              port: 39000
            initialDelaySeconds: 45
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 39000
            initialDelaySeconds: 60
            periodSeconds: 20
