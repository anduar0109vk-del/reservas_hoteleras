name: Validacion del proyecto

on:
  push:
    branches: [maestro, master, develop, "feature/**", "docs/**"]
  pull_request:
    branches: [maestro, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Compilar backend Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar backend
        run: bash ./mvnw -B -DskipTests package

  frontend:
    name: Validar y compilar frontend React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Analizar frontend
        run: npm run lint
      - name: Compilar frontend
        run: npm run build
