name: Validacion del proyecto

on:
  push:
    branches: [maestro, master, develop, "feature/**", "docs/**"]
  pull_request:
    branches: [maestro, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Compilar backend Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compilar backend y ejecutar pruebas
        run: bash ./mvnw verify
      - name: Guardar resultados JUnit del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-results
          path: target/surefire-reports/*.xml
          if-no-files-found: warn

  frontend:
    name: Validar y compilar frontend React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Analizar frontend
        run: npm run lint
      - name: Compilar frontend
        run: npm run build

  selenium:
    runs-on: ubuntu-latest
    services:
      selenium:
        image: selenium/standalone-chrome:4.27.0-20241204
        ports:
          - 4444:4444
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci
      - name: Iniciar frontend para Selenium
        working-directory: frontend
        run: |
          npm run dev -- --host 0.0.0.0 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5171/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/frontend.log"
          exit 1
      - name: Ejecutar prueba de interfaz Selenium
        run: bash ./mvnw -B -Pselenium verify
        env:
          SELENIUM_BASE_URL: http://127.0.0.1:5171/login
          SELENIUM_REMOTE_URL: http://127.0.0.1:4444/wd/hub
      - name: Guardar resultados JUnit y Selenium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-junit-results
          path: |
            target/surefire-reports/*.xml
            target/failsafe-reports/*.xml
          if-no-files-found: warn
      - name: Cerrar frontend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/frontend.pid" ]; then kill "$(cat "$RUNNER_TEMP/frontend.pid")" || true; fi

  container-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar Docker Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Construir imágenes de contenedores
        run: docker compose --env-file .env.example build
