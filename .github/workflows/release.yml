name: Release y Entrega Continua

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Etiqueta existente que se publicará (por ejemplo, v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Construir y publicar release
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código de la etiqueta seleccionada
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Construir backend
        run: bash ./mvnw -B clean package -DskipTests

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Construir frontend
        working-directory: frontend
        run: npm run build

      - name: Empaquetar frontend
        run: zip -r frontend-dist.zip frontend/dist

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Release ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            target/*.jar
            frontend-dist.zip
