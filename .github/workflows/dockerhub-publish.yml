name: Publicar imagen en Docker Hub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Construir y publicar backend
    if: vars.DOCKERHUB_IMAGE != ''
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
            ${{ vars.DOCKERHUB_IMAGE }}:latest
