# ===============================
# NOMBRE DE LA APLICACIÓN
# ===============================
spring.application.name=reservas-hoteleras

# ===============================
# CONFIGURACIÓN MYSQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reservas_hoteleras?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVIDOR
# ===============================
server.port=39000

# ===============================
# JWT (Autenticación) - ¡Asegúrate que tenga al menos 32 caracteres!
# ===============================
jwt.secret=${JWT_SECRET:claveLocalParaDesarrolloConMasDe32Caracteres}
jwt.expiration=86400000

# ===============================
# STRIPE (Pagos)
# ===============================
payments.demo-mode=${PAYMENTS_DEMO_MODE:false}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# ===============================
# CORS (Frontend)
# ===============================
frontend.url=http://localhost:5173

# ===============================
# LOGGING
# ===============================
logging.level.com.reservashoteleras=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n